# TypeScript types generated from this store's Go wire types. The Go structs
# are the source of truth; ts/ is a render of them. Regenerate with
# ./generate-ts.sh after changing a wire type.
packages:
  - path: "github.com/kayushkin/llm-bridge-server/internal/access/grants"
    output_path: "ts/model.ts"
    type_mappings:
      "json.RawMessage": "unknown"
      "time.Time": "string"
    exclude_files:
      - "store.go"
      - "principal_directory.go"
      - "principal_enforcement.go"
      - "resource_checker.go"
      - "handlers.go"
      - "import_standalone_database.go"
