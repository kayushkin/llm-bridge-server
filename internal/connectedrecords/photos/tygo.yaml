# TypeScript types generated from this store's Go wire types. The Go structs
# are the source of truth; ts/ is a render of them. Regenerate with
# ./generate-ts.sh after changing a wire type. Only photo.go, vocabulary.go,
# face_groups.go and people_on_photos.go hold wire types.
packages:
  - path: "github.com/kayushkin/llm-bridge-server/internal/connectedrecords/photos"
    output_path: "ts/model.ts"
    exclude_files:
      - "store.go"
      - "server.go"
      - "settings.go"
      - "import_standalone_database.go"
      - "faces_store.go"
      - "faces_server.go"
      - "face_groups_store.go"
      - "face_groups_server.go"
